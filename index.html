<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defaults for crawlers that read the raw HTML; SeoHead replaces every data-seo tag per route once the app runs. -->
    <title>AdAstra AI – Your Personal Vedic Astrology Assistant</title>
    <meta
      name="description"
      content="Your personal Vedic astrology assistant. Ask about your birth chart, kundli and dasha, mastered on the ancient texts unabridged and the celestial sky."
      data-seo
    />
    <!--seo-robots-->
    <meta property="og:type" content="website" data-seo />
    <meta property="og:site_name" content="AdAstra AI" data-seo />
    <meta property="og:locale" content="en_US" data-seo />
    <meta property="og:title" content="AdAstra AI – Your Personal Vedic Astrology Assistant" data-seo />
    <meta
      property="og:description"
      content="Your personal Vedic astrology assistant. Ask about your birth chart, kundli and dasha, mastered on the ancient texts unabridged and the celestial sky."
      data-seo
    />
    <meta property="og:image" content="/images/og-aiastra.png" data-seo />
    <meta property="og:image:alt" content="AdAstra AI – Your Personal Vedic Astrology Assistant" data-seo />
    <meta name="twitter:card" content="summary_large_image" data-seo />
    <meta name="twitter:title" content="AdAstra AI – Your Personal Vedic Astrology Assistant" data-seo />
    <meta name="twitter:image:alt" content="AdAstra AI – Your Personal Vedic Astrology Assistant" data-seo />
    <meta name="theme-color" content="#111827" />
    <!-- The viewer's theme before anything paints, on the signed-in pages only; public pages stay dark (src/lib/theme.ts). -->
    <script>
      (function () {
        var c = 'system';
        try {
          var v = localStorage.getItem('aiastra.theme');
          if (v === 'light' || v === 'dark' || v === 'system') c = v;
        } catch (e) {}
        var path = location.pathname;
        var themed = /^\/(dashboard|profile|welcome)(\/|$)/.test(path);
        var t = themed ? c : 'dark';
        if (t === 'system') {
          try {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches === false ? 'light' : 'dark';
          } catch (e) {
            t = 'dark';
          }
        }
        var r = document.documentElement;
        r.classList.add(t);
        r.style.colorScheme = t;
        if (t === 'light') {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#f5f3ff');
        }
      })();
    </script>
    <meta name="application-name" content="AdAstra AI" />
    <meta name="apple-mobile-web-app-title" content="AdAstra AI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/og-aiastra.png" />
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://challenges.cloudflare.com" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5EPCTXFV8S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-5EPCTXFV8S', { allow_google_signals: false, allow_ad_personalization_signals: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
