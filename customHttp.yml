# Amplify Hosting custom headers (read from the repo root at build time).
# Search engines must not index the sign-in and sign-up flow or the signed-in app, even when they fetch the raw HTML
# before the app sets <meta name="robots">. Keep these prefixes in step with NOINDEX_PREFIXES in src/lib/seoConfig.ts.
customHeaders:
  - pattern: '/signin'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/signin/*'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/signup'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/signup/*'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/dashboard'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/dashboard/*'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/profile'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  - pattern: '/profile/*'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
  # every file under /assets carries a content hash in its name (scenes, scripts, styles), so it never changes in place
  - pattern: '/assets/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=()'
      # CSP tailored to index.html (theme-init + gtag inline SHA-256 LF/CRLF hashes + GA4), Cloudflare Turnstile,
      # MediaPipe WASM ('wasm-unsafe-eval'), and CloudFront/AWS/Render/localhost API origins. No Google Fonts are used.
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://www.googletagmanager.com 'sha256-6Tmbnp5uqhGVW+DGSoADpwrXE//3v0S/63rX7tJJkoY=' 'sha256-xgBkV6G3dyRLMuqyr9id6iUxakV9crXtmtXD1W/QZHw=' 'sha256-hV7eh21ir0TteSG/V2HJeOc3SgTIZmYf1FpQ+zmXA/k=' 'sha256-kkgR62KQue4nP7d13aYg6bKmKP/7IiV5arNhVavbBxk='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.cloudfront.net https://*.amazonaws.com https://*.onrender.com https://challenges.cloudflare.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com http://localhost:* ws://localhost:*; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/telemetry/csp-report"
